<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carnet del Estudiante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .carnet {
            width: 320px;
            height: 200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            padding: 15px;
            text-align: center;
        }
        .carnet img {
            width: 100px;
            height: 100px;
            border-radius: 30%;
            object-fit: cover;
        }
        .carnet h2 {
            margin: 10px 0 0;
            font-size: 18px;
        }
        .carnet p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="carnet">
        {% if estudiante.foto %}
            <img src="{{ estudiante.foto.url }}" alt="Foto del estudiante">
        {% else %}
            <img src="https://via.placeholder.com/80" alt="Sin foto">
        {% endif %}

        <h2> Nombre:</strong>{{ estudiante.nombre }} </h2>
        <p><strong>DNI:</strong> {{ estudiante.dni }}</p>
        <p><strong>Grado:</strong> {{ estudiante.grado }}</p>
        <p><strong>Carrera:</strong> {{ estudiante.carrera }}</p>
        <a href="{% url 'carnet_pdf' estudiante.id %}" target="_blank" style="display:inline-block; margin-top:10px; padding:8px 16px; background:#3498db; color:white; text-decoration:none; border-radius:5px;">
         Descargar PDF</a>

    </div>
</body>
</html>
